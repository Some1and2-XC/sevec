[package]
name = "sevec-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.sevec]
path = ".."

[[bin]]
name = "sevec"
path = "fuzz_targets/sevec.rs"
test = false
doc = false
bench = false
